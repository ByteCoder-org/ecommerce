input {
  beats {
    port => 5044
  }
}

filter {
  # Add container name for easier filtering
  if [container][name] {
    mutate {
      add_field => { "service_name" => "%{[container][name]}" }
    }
  }

  # Handle Spring Boot services (JSON logs)
  if [container][name] =~ /^(product-service|api-gateway|cart-service)$/ {
    # First, extract the actual log message from Docker's JSON wrapper
    if [message] =~ /^\{.*\}$/ {
      json {
        source => "message"
        target => "docker_json"
        tag_on_failure => ["_docker_json_parse_failure"]
      }

      if "_docker_json_parse_failure" not in [tags] and [docker_json][log] {
        mutate {
          replace => { "message" => "%{[docker_json][log]}" }
        }
      }
    }

    # Now try to parse the application's JSON log
    if [message] =~ /^\{.*\}$/ {
      json {
        source => "message"
        target => "parsed_json"
        tag_on_failure => ["_app_json_parse_failure"]
      }
    }

    # If JSON parsing succeeded, use structured fields
    if "_app_json_parse_failure" not in [tags] and [parsed_json] {
      mutate {
        add_field => { 
          "log_level" => "%{[parsed_json][level]}"
          "logger_name" => "%{[parsed_json][loggerName]}"
          "thread_name" => "%{[parsed_json][thread]}"
        }
      }

      # Parse timestamp from JSON
      if [parsed_json][timestamp] {
        date {
          match => [ "[parsed_json][timestamp]", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS" ]
          target => "@timestamp"
        }
      }
    } else {
      # Fallback: Parse plain text Spring logs
      grok {
        match => { 
          "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{DATA:thread_name}\] %{LOGLEVEL:log_level}%{SPACE}%{DATA:logger_name} - %{GREEDYDATA:message}" 
        }
        tag_on_failure => ["_grok_parse_failure"]
      }

      # If grok also fails, just use the raw message
      if "_grok_parse_failure" in [tags] {
        mutate {
          add_field => { 
            "log_level" => "INFO"
          }
        }
      }

      # Parse timestamp from grok
      if [timestamp] {
        date {
          match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
          target => "@timestamp"
          remove_field => [ "timestamp" ]
        }
      }
    }

    # Extract request information from API Gateway logs
    if [container][name] == "api-gateway" and [message] {
      grok {
        match => { "message" => "(?<http_method>GET|POST|PUT|DELETE|PATCH) %{URIPATHPARAM:uri}" }
        tag_on_failure => []
      }
    }

    # Add service type tag
    mutate {
      add_field => { "service_type" => "backend" }
    }
  }

  # Handle Nginx/Frontend logs  
  else if [container][name] =~ /frontend/ {
    # Parse Nginx access logs
    grok {
      match => { 
        "message" => "%{IPORHOST:client_ip} - - \[%{HTTPDATE:timestamp}\] \"%{WORD:http_method} %{URIPATHPARAM:uri}(?:%{URIPARAM:params})? HTTP/%{NUMBER:http_version}\" %{NUMBER:response_code} %{NUMBER:response_size} \"%{DATA:referrer}\" \"%{DATA:user_agent}\"" 
      }
      tag_on_failure => ["_nginxparsefailure"]
    }
    
    # Parse timestamp from Nginx logs
    if [timestamp] {
      date {
        match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
        target => "@timestamp"
        remove_field => [ "timestamp" ]
      }
    }
    
    # Handle other frontend logs (startup messages, etc.)
    if "_nginxparsefailure" in [tags] {
      mutate {
        add_field => { "message" => "%{message}" }
      }
    }
    
    mutate {
      add_field => { "service_type" => "frontend" }
    }
  }

  # Handle PostgreSQL logs (including keycloak-db which is postgres)
  else if [container][name] =~ /(postgres|keycloak-db)/ {
    # Try to parse PostgreSQL logs with explicit log levels
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} UTC \[%{NUMBER:pid}\] %{WORD:raw_log_level}:%{SPACE}%{GREEDYDATA:message}" 
      }
      tag_on_failure => ["_postgres_detailed_parse_failure"]
    }
    
    # Map PostgreSQL log levels to standard levels
    if "_postgres_detailed_parse_failure" not in [tags] and [raw_log_level] {
      if [raw_log_level] == "LOG" {
        mutate { add_field => { "log_level" => "INFO" } }
      } else if [raw_log_level] in ["ERROR", "FATAL", "PANIC"] {
        mutate { add_field => { "log_level" => "ERROR" } }
      } else if [raw_log_level] in ["WARNING", "WARN"] {
        mutate { add_field => { "log_level" => "WARN" } }
      } else {
        mutate { add_field => { "log_level" => "%{raw_log_level}" } }
      }
    } else {
      # If that fails, try simpler PostgreSQL format
      grok {
        match => { 
          "message" => "%{TIMESTAMP_ISO8601:timestamp} UTC.*?%{GREEDYDATA:message}" 
        }
        tag_on_failure => ["_postgres_simple_parse_failure"]
      }
      
      # Determine log level from message content for PostgreSQL
      if [message] {
        if [message] =~ /(?i)(error|fatal|panic|does not exist|permission denied|could not|failed to)/ {
          mutate { add_field => { "log_level" => "ERROR" } }
        } else if [message] =~ /(?i)(warning|warn|deprecated)/ {
          mutate { add_field => { "log_level" => "WARN" } }
        } else {
          mutate { add_field => { "log_level" => "INFO" } }
        }
      }
    }
    
    # Handle PostgreSQL startup/shutdown messages without timestamps
    if "_postgres_simple_parse_failure" in [tags] {
      mutate {
        add_field => { 
          "message" => "%{message}"
        }
      }
      
      # Check if it's an error message
      if [message] =~ /(?i)(error|failed|fatal|does not exist|permission denied)/ {
        mutate { add_field => { "log_level" => "ERROR" } }
      } else if [message] =~ /(?i)(warning|warn)/ {
        mutate { add_field => { "log_level" => "WARN" } }
      } else {
        mutate { add_field => { "log_level" => "INFO" } }
      }
    }
    
    # Parse timestamp from PostgreSQL logs
    if [timestamp] {
      date {
        match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
        target => "@timestamp"
        remove_field => [ "timestamp" ]
      }
    }
    
    # Clean up message for PostgreSQL
    if [message] {
      mutate {
        gsub => [
          "message", "^LOG:\s*", "",
          "message", "^STATEMENT:\s*", "",
          "message", "^ERROR:\s*", "",
          "message", "^WARNING:\s*", ""
        ]
      }
    }
    
    # Set appropriate service type based on container name
    if [container][name] =~ /keycloak-db/ {
      mutate {
        add_field => { "service_type" => "auth_database" }
      }
    } else {
      mutate {
        add_field => { "service_type" => "database" }
      }
    }
    
    # Clean up temporary fields
    if [raw_log_level] {
      mutate { remove_field => [ "raw_log_level" ] }
    }
  }

  # Handle Keycloak logs (but NOT keycloak-db which is postgres)
  else if [container][name] =~ /keycloak/ and [container][name] !~ /keycloak-db/ {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:log_level}%{SPACE}\[%{DATA:logger_name}\] \(%{DATA:thread_name}\) %{GREEDYDATA:message}" 
      }
      tag_on_failure => ["_keycloakparsefailure"]
    }
    
    # Parse timestamp from Keycloak logs
    if [timestamp] {
      date {
        match => [ "timestamp", "yyyy-MM-dd HH:mm:ss,SSS" ]
        target => "@timestamp"
        remove_field => [ "timestamp" ]
      }
    }
    
    # Handle unparsed Keycloak messages
    if "_keycloakparsefailure" in [tags] {
      mutate {
        add_field => { 
          "log_level" => "INFO"
        }
      }
    }
    
    mutate {
      add_field => { "service_type" => "auth" }
    }
  }

  # Handle any other services
  else {
    mutate {
      add_field => { 
        "service_type" => "unknown"
      }
    }
  }

  # Clean up temporary fields
  if [parsed_json] {
    mutate {
      remove_field => [ "parsed_json" ]
    }
  }
  
  if [docker_json] {
    mutate {
      remove_field => [ "docker_json" ]
    }
  }

  # Ensure all logs have required fields
  if ![log_level] {
    mutate {
      add_field => { "log_level" => "INFO" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "ecommerce-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
  
  # Debug output (remove in production)
  stdout {
    codec => rubydebug
  }
}