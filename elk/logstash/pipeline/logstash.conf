input {
  beats {
    port => 5044
  }
}

filter {
  if [container][name] =~ /^(product-service|api-gateway|service-registry)$/ {
    # Parse Java/Spring logs
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:logger} - %{GREEDYDATA:log_message}" }
    }

    # Extract request information from API Gateway logs
    if [container][name] == "api-gateway" {
      grok {
        match => { "log_message" => "(?<http_method>GET|POST|PUT|DELETE|PATCH) %{URIPATHPARAM:uri}" }
        tag_on_failure => []
      }
    }

    # Add service type tag
    mutate {
      add_field => { "service_type" => "backend" }
    }
  }

  else if [container][name] == "ecommerce-frontend" {
    # Parse frontend logs
    mutate {
      add_field => { "service_type" => "frontend" }
    }
  }

  else if [container][name] == "keycloak" {
    # Parse Keycloak logs
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:log_message}" }
    }
    mutate {
      add_field => { "service_type" => "auth" }
    }
  }

  # Add timestamp for all logs
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
    remove_field => [ "timestamp" ]
    tag_on_failure => ["_dateparsefailure"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "ecommerce-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
}