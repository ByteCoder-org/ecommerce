services:

  # Service Registry
  service-registry:
    build: ./service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PostgreSQL for app
  postgres:
    image: 'postgres:latest'
    container_name: ecommerce-db
    environment:
      - 'POSTGRES_DB=ecommerce'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Keycloak PostgreSQL
  keycloak-postgres:
    image: 'postgres:latest'
    container_name: keycloak-db
    environment:
      - 'POSTGRES_DB=keycloak'
      - 'POSTGRES_PASSWORD=keycloak'
      - 'POSTGRES_USER=keycloak'
    ports:
      - '5433:5432'
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Keycloak Auth Server
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    container_name: keycloak
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=8000
      - KC_HOSTNAME_PATH=/auth
      - KC_HOSTNAME_URL=http://localhost:8000/auth
      - KC_SPI_HOSTNAME_DEFAULT_FRONTEND_URL=http://localhost:8000/auth
      - KC_HTTP_RELATIVE_PATH=/auth
    ports:
      - "8080:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    command: start-dev
    volumes:
      - ./keycloak/ecommerce-realm.json:/tmp/ecommerce-realm.json
    networks:
      - ecommerce-network

  keycloak-healthcheck:
    image: curlimages/curl:latest
    depends_on:
      - keycloak
    command: [ "sh", "-c", "until curl -s http://keycloak:8080/auth/ > /dev/null; do sleep 5; done; echo 'Keycloak is up!'" ]
    networks:
      - ecommerce-network

  # Keycloak Setup
  keycloak-setup:
    image: curlimages/curl:latest
    volumes:
      - ./keycloak/import-realm.sh:/import-realm.sh
      - ./keycloak/ecommerce-realm.json:/tmp/ecommerce-realm.json
    depends_on:
      keycloak-healthcheck:
        condition: service_completed_successfully
    command: ["/bin/sh", "/import-realm.sh"]
    networks:
      - ecommerce-network

  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      # Make sure hostname is set to the container name for proper registration
      - EUREKA_INSTANCE_HOSTNAME=api-gateway
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
      # Product service route with CORS headers
      - SPRING_CLOUD_GATEWAY_ROUTES[0].ID=product-service
      - SPRING_CLOUD_GATEWAY_ROUTES[0].URI=lb://product-service
      - SPRING_CLOUD_GATEWAY_ROUTES[0].PREDICATES[0]=Path=/api/v1/products/**
      - SPRING_CLOUD_GATEWAY_ROUTES[0].FILTERS[0]=AddResponseHeader=Access-Control-Allow-Origin, http://localhost:3000
      - SPRING_CLOUD_GATEWAY_ROUTES[0].FILTERS[1]=AddResponseHeader=Access-Control-Allow-Methods, GET,POST,PUT,DELETE,OPTIONS
      - SPRING_CLOUD_GATEWAY_ROUTES[0].FILTERS[2]=AddResponseHeader=Access-Control-Allow-Headers, Content-Type,Authorization
      - SPRING_CLOUD_GATEWAY_ROUTES[0].FILTERS[3]=AddResponseHeader=Access-Control-Allow-Credentials, true
      # Keycloak route with CORS headers
      - SPRING_CLOUD_GATEWAY_ROUTES[1].ID=keycloak-service
      - SPRING_CLOUD_GATEWAY_ROUTES[1].URI=http://keycloak:8080
      - SPRING_CLOUD_GATEWAY_ROUTES[1].PREDICATES[0]=Path=/auth/**
      - SPRING_CLOUD_GATEWAY_ROUTES[1].FILTERS[0]=PreserveHostHeader
      - SPRING_CLOUD_GATEWAY_ROUTES[1].FILTERS[1]=AddResponseHeader=Access-Control-Allow-Origin, http://localhost:3000
      - SPRING_CLOUD_GATEWAY_ROUTES[1].FILTERS[2]=AddResponseHeader=Access-Control-Allow-Methods, GET,POST,PUT,DELETE,OPTIONS
      - SPRING_CLOUD_GATEWAY_ROUTES[1].FILTERS[3]=AddResponseHeader=Access-Control-Allow-Headers, Content-Type,Authorization,Origin
      - SPRING_CLOUD_GATEWAY_ROUTES[1].FILTERS[4]=AddResponseHeader=Access-Control-Allow-Credentials, true
      # Frontend redirect route for OAuth flow
      - SPRING_CLOUD_GATEWAY_ROUTES[2].ID=frontend-redirect
      - SPRING_CLOUD_GATEWAY_ROUTES[2].URI=http://frontend:80
      - SPRING_CLOUD_GATEWAY_ROUTES[2].PREDICATES[0]=Path=/oauth/callback,/callback,/silent-refresh
      # OAuth config
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI=http://localhost:8000/auth/realms/ecommerce
      - SERVER_PORT=8000
    depends_on:
      service-registry:
        condition: service_healthy
      keycloak-healthcheck:
        condition: service_completed_successfully
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8000/actuator/health"]
      interval: 5s
      timeout: 10s
      retries: 5

  # Product Service
  product-service:
    build: ./product-service
    container_name: product-service
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ecommerce
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI=http://localhost:8000/auth/realms/ecommerce
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI=http://keycloak:8080/auth/realms/ecommerce/protocol/openid-connect/certs
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB=DEBUG
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    ports:
      - "8081:8081"
    networks:
      - ecommerce-network

  # Frontend
  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    ports:
      - "3000:80"
    depends_on:
      product-service:
        condition: service_started
      keycloak-healthcheck:
        condition: service_completed_successfully
#      api-gateway:
#        condition: service_healthy
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres-data:
  keycloak-data: