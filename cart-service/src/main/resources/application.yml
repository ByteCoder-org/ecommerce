server:
  port: 8082

spring:
  application:
    name: cart-service
  redis:
    host: redis
    port: 6379

# Cart expiration configuration
cart:
  expiration:
    # Cart expires after 7 days of inactivity (in seconds)
    ttl: 604800

eureka:
  client:
    serviceUrl:
      defaultZone: http://service-registry:8761/eureka/
  instance:
    preferIpAddress: true


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: true
  packages-to-scan: com.bytercoder.ecommerce.cart.controller

logging:
  level:
    root: info